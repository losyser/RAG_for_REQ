<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1770" viewBox="0 0 1420 1770"><rect width="100%" height="100%" fill="#f8fafc"/><style>text{font-family:Segoe UI,Microsoft YaHei,sans-serif;fill:#172b4d} .small{font-size:12px} .body{font-size:13px}</style><text x="32" y="35" font-size="22">Cooling requirements — independent inspection preview</text><text x="32" y="60" class="body">Generated from audited XMI. Nesting = source/output grouping. Not an EA-rendered screenshot.</text><rect x="32" y="100" width="1350" height="62" rx="6" fill="#e2e8f0"/><text x="48" y="124" font-size="17">OR041  Seawater Cooling Low Supply Alarm</text><text x="48" y="146" class="body">For the seawater cooling system, if a main circulation pump-related configuration is adopted, a low supply condition must be able to trigger an alarm to facilit</text><rect x="32" y="185" width="320" height="200" rx="6" fill="#fef3c7" stroke="#64748b"/><text x="42" y="205" class="small">OR041.1  Low Supply Alarm Display</text><text x="42" y="221" class="small">Requirement</text><text x="42" y="237" class="small"></text><text x="42" y="253" class="small">When the seawater cooling system is</text><text x="42" y="269" class="small">configured with a main circulation pump, a</text><text x="42" y="285" class="small">low supply alarm function shall be provided.</text><text x="42" y="301" class="small">The alarm signal shall be capable of being</text><text x="42" y="317" class="small">displayed on the bridge or at the main</text><text x="42" y="333" class="small"></text><text x="42" y="349" class="small">Grade C | Deferred</text><text x="42" y="365" class="small">OPEN_ITEM</text><rect x="372" y="185" width="320" height="200" rx="6" fill="#fef3c7" stroke="#64748b"/><text x="382" y="205" class="small">OR041.2  Cooling Water Pump Redundancy</text><text x="382" y="221" class="small">Requiremen</text><text x="382" y="237" class="small"></text><text x="382" y="253" class="small">The seawater cooling system shall be</text><text x="382" y="269" class="small">provided with at least two cooling water</text><text x="382" y="285" class="small">pumps, one of which shall be a standby pump.</text><text x="382" y="301" class="small">The capacity of the standby pump shall not</text><text x="382" y="317" class="small">be less than the capacity of the main pump,</text><text x="382" y="333" class="small"></text><text x="382" y="349" class="small">Grade C | Deferred</text><text x="382" y="365" class="small">OPEN_ITEM</text><rect x="712" y="185" width="320" height="200" rx="6" fill="#fef3c7" stroke="#64748b"/><text x="722" y="205" class="small">OR041.3  Standby Pump Start on Alarm</text><text x="722" y="221" class="small"></text><text x="722" y="237" class="small">When the seawater cooling system low supply</text><text x="722" y="253" class="small">alarm is triggered, the standby pump shall</text><text x="722" y="269" class="small">be capable of being started automatically or</text><text x="722" y="285" class="small">manually, or changeover to the standby pump</text><text x="722" y="301" class="small">shall be possible, to restore the cooling</text><text x="722" y="317" class="small"></text><text x="722" y="333" class="small">Grade C | Deferred</text><text x="722" y="349" class="small">OPEN_ITEM</text><rect x="1052" y="185" width="320" height="200" rx="6" fill="#fef3c7" stroke="#64748b"/><text x="1062" y="205" class="small">OR041.4  Independent Low Supply Alarm</text><text x="1062" y="221" class="small">Sensor</text><text x="1062" y="237" class="small"></text><text x="1062" y="253" class="small">The sensor for the seawater cooling system</text><text x="1062" y="269" class="small">low supply alarm shall be provided</text><text x="1062" y="285" class="small">independently and shall be capable of</text><text x="1062" y="301" class="small">continuously monitoring the seawater cooling</text><text x="1062" y="317" class="small">water supply pressure or flow. The alarm</text><text x="1062" y="333" class="small"></text><text x="1062" y="349" class="small">Grade C | Deferred</text><text x="1062" y="365" class="small">OPEN_ITEM</text><rect x="32" y="405" width="320" height="200" rx="6" fill="#fef3c7" stroke="#64748b"/><text x="42" y="425" class="small">OR041.5  Alarm Threshold Configuration</text><text x="42" y="441" class="small">Limitation</text><text x="42" y="457" class="small"></text><text x="42" y="473" class="small">The threshold and actuation logic of the</text><text x="42" y="489" class="small">seawater cooling system low supply alarm</text><text x="42" y="505" class="small">shall be strictly limited to the</text><text x="42" y="521" class="small">corresponding manufacturer, engine model,</text><text x="42" y="537" class="small">and control system configuration scope and</text><text x="42" y="553" class="small"></text><text x="42" y="569" class="small">Grade C | Deferred</text><text x="42" y="585" class="small">OPEN_ITEM</text><rect x="32" y="650" width="1350" height="62" rx="6" fill="#e2e8f0"/><text x="48" y="674" font-size="17">OR052  Cooling Pump Maintenance Access Space</text><text x="48" y="696" class="body">Space must be provided for maintenance of the cooling water pump seals, bearings, and motor; it must not be necessary to move many pipes just to remove a small </text><rect x="32" y="735" width="320" height="200" rx="6" fill="#fef3c7" stroke="#64748b"/><text x="42" y="755" class="small">OR052.1  Direct Removal of Pump</text><text x="42" y="771" class="small">Components</text><text x="42" y="787" class="small"></text><text x="42" y="803" class="small">The seals, bearings, and motor of the</text><text x="42" y="819" class="small">cooling water pump shall be arranged so that</text><text x="42" y="835" class="small">they can be directly removed and installed</text><text x="42" y="851" class="small">without first moving unrelated piping or</text><text x="42" y="867" class="small">other equipment.</text><text x="42" y="883" class="small"></text><text x="42" y="899" class="small">Grade C | Deferred</text><text x="42" y="915" class="small">OPEN_ITEM</text><rect x="372" y="735" width="320" height="200" rx="6" fill="#fef3c7" stroke="#64748b"/><text x="382" y="755" class="small">OR052.2  Adequate Maintenance Space</text><text x="382" y="771" class="small">Around Pump</text><text x="382" y="787" class="small"></text><text x="382" y="803" class="small">Sufficient maintenance space shall be</text><text x="382" y="819" class="small">provided around the cooling water pump to</text><text x="382" y="835" class="small">facilitate removal and installation of the</text><text x="382" y="851" class="small">seals, bearings, and motor.</text><text x="382" y="867" class="small"></text><text x="382" y="883" class="small">Grade C | Deferred</text><text x="382" y="899" class="small">OPEN_ITEM</text><rect x="712" y="735" width="320" height="200" rx="6" fill="#fef3c7" stroke="#64748b"/><text x="722" y="755" class="small">OR052.3  Accessible Pump Piping</text><text x="722" y="771" class="small">Arrangement</text><text x="722" y="787" class="small"></text><text x="722" y="803" class="small">The piping arrangement of the cooling water</text><text x="722" y="819" class="small">pump shall allow convenient access to the</text><text x="722" y="835" class="small">pump seals, bearings, and motor, and removal</text><text x="722" y="851" class="small">of these components shall not require moving</text><text x="722" y="867" class="small">a large amount of piping.</text><text x="722" y="883" class="small"></text><text x="722" y="899" class="small">Grade C | Deferred</text><text x="722" y="915" class="small">OPEN_ITEM</text><rect x="1052" y="735" width="320" height="200" rx="6" fill="#fef3c7" stroke="#64748b"/><text x="1062" y="755" class="small">OR052.4  Manufacturer Maintenance</text><text x="1062" y="771" class="small">Space Complianc</text><text x="1062" y="787" class="small"></text><text x="1062" y="803" class="small">The maintenance space for the cooling water</text><text x="1062" y="819" class="small">pump seals, bearings, and motor shall meet</text><text x="1062" y="835" class="small">the manufacturer&#x27;s specified maintenance</text><text x="1062" y="851" class="small">operation requirements, ensuring that</text><text x="1062" y="867" class="small">maintenance can be performed without</text><text x="1062" y="883" class="small"></text><text x="1062" y="899" class="small">Grade C | Deferred</text><text x="1062" y="915" class="small">OPEN_ITEM</text><rect x="32" y="980" width="1350" height="62" rx="6" fill="#e2e8f0"/><text x="48" y="1004" font-size="17">OR008  Temperature Control Valve Verification</text><text x="48" y="1026" class="body">The setpoint and installation position of the temperature control valve must be checked against the main engine requirements; otherwise, the water temperature m</text><rect x="32" y="1065" width="320" height="200" rx="6" fill="#dbeafe" stroke="#64748b"/><text x="42" y="1085" class="small">OR008.1  High Temperature Cooling</text><text x="42" y="1101" class="small">Valve Setting</text><text x="42" y="1117" class="small"></text><text x="42" y="1133" class="small">The setpoint of the temperature control</text><text x="42" y="1149" class="small">valve shall be checked against the main</text><text x="42" y="1165" class="small">engine manufacturer&#x27;s technical data. The</text><text x="42" y="1181" class="small">high-temperature cooling water engine outlet</text><text x="42" y="1197" class="small">temperature setpoint shall be 79°C nominal,</text><text x="42" y="1213" class="small"></text><text x="42" y="1229" class="small">Grade B | Direct</text><text x="42" y="1245" class="small">ENGINEER_CONFIRM</text><rect x="372" y="1065" width="320" height="200" rx="6" fill="#dbeafe" stroke="#64748b"/><text x="382" y="1085" class="small">OR008.2  Low Temperature Cooling Valve</text><text x="382" y="1101" class="small">Setting</text><text x="382" y="1117" class="small"></text><text x="382" y="1133" class="small">The setpoint of the temperature control</text><text x="382" y="1149" class="small">valve shall be checked against the main</text><text x="382" y="1165" class="small">engine manufacturer&#x27;s technical data. The</text><text x="382" y="1181" class="small">low-temperature cooling water engine outlet</text><text x="382" y="1197" class="small">temperature setpoint shall be 35°C nominal,</text><text x="382" y="1213" class="small"></text><text x="382" y="1229" class="small">Grade B | Direct</text><text x="382" y="1245" class="small">ENGINEER_CONFIRM</text><rect x="712" y="1065" width="320" height="200" rx="6" fill="#dbeafe" stroke="#64748b"/><text x="722" y="1085" class="small">OR008.3  Lubricating Oil Temperature</text><text x="722" y="1101" class="small">Valve Settin</text><text x="722" y="1117" class="small"></text><text x="722" y="1133" class="small">The setpoint of the temperature control</text><text x="722" y="1149" class="small">valve shall be checked against the main</text><text x="722" y="1165" class="small">engine manufacturer&#x27;s technical data. The</text><text x="722" y="1181" class="small">lubricating oil inlet temperature setpoint</text><text x="722" y="1197" class="small">shall be 66°C nominal, and the mechanical</text><text x="722" y="1213" class="small"></text><text x="722" y="1229" class="small">Grade B | Direct</text><text x="722" y="1245" class="small">ENGINEER_CONFIRM</text><rect x="1052" y="1065" width="320" height="200" rx="6" fill="#dbeafe" stroke="#64748b"/><text x="1062" y="1085" class="small">OR008.4  Three Way Valve Installation</text><text x="1062" y="1101" class="small">Position</text><text x="1062" y="1117" class="small"></text><text x="1062" y="1133" class="small">The installation position of the temperature</text><text x="1062" y="1149" class="small">control valve shall be checked against the</text><text x="1062" y="1165" class="small">main engine manufacturer&#x27;s requirements. The</text><text x="1062" y="1181" class="small">three-way valve shall be installed as a</text><text x="1062" y="1197" class="small">mixing valve, and its design pressure loss</text><text x="1062" y="1213" class="small"></text><text x="1062" y="1229" class="small">Grade B | Direct</text><text x="1062" y="1245" class="small">ENGINEER_CONFIRM</text><rect x="32" y="1285" width="320" height="200" rx="6" fill="#fef3c7" stroke="#64748b"/><text x="42" y="1305" class="small">OR008.5  Temperature Sensor Piping</text><text x="42" y="1321" class="small">Distance</text><text x="42" y="1337" class="small"></text><text x="42" y="1353" class="small">The installation position of the temperature</text><text x="42" y="1369" class="small">control valve shall be checked against the</text><text x="42" y="1385" class="small">main engine manufacturer&#x27;s requirements. The</text><text x="42" y="1401" class="small">pipe length between the temperature sensor</text><text x="42" y="1417" class="small">installation position and the three-way</text><text x="42" y="1433" class="small"></text><text x="42" y="1449" class="small">Grade C | Direct</text><text x="42" y="1465" class="small">ENGINEER_CONFIRM</text><rect x="372" y="1285" width="320" height="200" rx="6" fill="#dbeafe" stroke="#64748b"/><text x="382" y="1305" class="small">OR008.6  High Temperature Control</text><text x="382" y="1321" class="small">Range Setting</text><text x="382" y="1337" class="small"></text><text x="382" y="1353" class="small">The setpoint of the temperature control</text><text x="382" y="1369" class="small">valve shall be checked against the main</text><text x="382" y="1385" class="small">engine manufacturer&#x27;s technical data. The</text><text x="382" y="1401" class="small">high-temperature cooling water engine outlet</text><text x="382" y="1417" class="small">temperature shall be controlled between 90</text><text x="382" y="1433" class="small"></text><text x="382" y="1449" class="small">Grade B | Direct</text><text x="382" y="1465" class="small">ENGINEER_CONFIRM</text><rect x="712" y="1285" width="320" height="200" rx="6" fill="#fef3c7" stroke="#64748b"/><text x="722" y="1305" class="small">OR008.7  External Controller for</text><text x="722" y="1321" class="small">Shared System</text><text x="722" y="1337" class="small"></text><text x="722" y="1353" class="small">The installation position of the temperature</text><text x="722" y="1369" class="small">control valve shall be checked against the</text><text x="722" y="1385" class="small">main engine manufacturer&#x27;s requirements.</text><text x="722" y="1401" class="small">When multiple engines share a combined low-</text><text x="722" y="1417" class="small">temperature cooling water system, an</text><text x="722" y="1433" class="small"></text><text x="722" y="1449" class="small">Grade C | Deferred</text><text x="722" y="1465" class="small">OPEN_ITEM</text><rect x="1052" y="1285" width="320" height="200" rx="6" fill="#fef3c7" stroke="#64748b"/><text x="1062" y="1305" class="small">OR008.8  Common Low Temperature</text><text x="1062" y="1321" class="small">Control Valve</text><text x="1062" y="1337" class="small"></text><text x="1062" y="1353" class="small">The installation position of the temperature</text><text x="1062" y="1369" class="small">control valve shall be checked against the</text><text x="1062" y="1385" class="small">main engine manufacturer&#x27;s requirements.</text><text x="1062" y="1401" class="small">When engine-driven low-temperature pumps are</text><text x="1062" y="1417" class="small">used to cool external equipment, a common</text><text x="1062" y="1433" class="small"></text><text x="1062" y="1449" class="small">Grade C | Deferred</text><text x="1062" y="1465" class="small">OPEN_ITEM</text><rect x="32" y="1505" width="320" height="200" rx="6" fill="#dbeafe" stroke="#64748b"/><text x="42" y="1525" class="small">OR008.9  Auxiliary Engine Outlet</text><text x="42" y="1541" class="small">Temperature Sett</text><text x="42" y="1557" class="small"></text><text x="42" y="1573" class="small">The setpoint of the temperature control</text><text x="42" y="1589" class="small">valve shall be checked against the main</text><text x="42" y="1605" class="small">engine manufacturer&#x27;s technical data. The</text><text x="42" y="1621" class="small">auxiliary engine outlet temperature shall be</text><text x="42" y="1637" class="small">maintained constant at approximately 80°C.</text><text x="42" y="1653" class="small"></text><text x="42" y="1669" class="small">Grade B | Direct</text><text x="42" y="1685" class="small">ENGINEER_CONFIRM</text><rect x="372" y="1505" width="320" height="200" rx="6" fill="#dbeafe" stroke="#64748b"/><text x="382" y="1525" class="small">OR008.10  Auxiliary Engine Outlet</text><text x="382" y="1541" class="small">Temperature Sett</text><text x="382" y="1557" class="small"></text><text x="382" y="1573" class="small">The setpoint of the temperature control</text><text x="382" y="1589" class="small">valve shall be checked against the main</text><text x="382" y="1605" class="small">engine manufacturer&#x27;s technical data. The</text><text x="382" y="1621" class="small">auxiliary engine outlet temperature shall be</text><text x="382" y="1637" class="small">maintained constant at approximately 80°C.</text><text x="382" y="1653" class="small"></text><text x="382" y="1669" class="small">Grade B | Direct</text><text x="382" y="1685" class="small">ENGINEER_CONFIRM</text><rect x="712" y="1505" width="320" height="200" rx="6" fill="#fef3c7" stroke="#64748b"/><text x="722" y="1525" class="small">OR008.11  Valve Setting and Position</text><text x="722" y="1541" class="small">Verification</text><text x="722" y="1557" class="small"></text><text x="722" y="1573" class="small">The setpoint and installation position of</text><text x="722" y="1589" class="small">the temperature control valve shall be</text><text x="722" y="1605" class="small">checked against the main engine</text><text x="722" y="1621" class="small">manufacturer&#x27;s technical data or project</text><text x="722" y="1637" class="small">calculation documents. The parameter</text><text x="722" y="1653" class="small"></text><text x="722" y="1669" class="small">Grade C | Deferred</text><text x="722" y="1685" class="small">OPEN_ITEM</text></svg>